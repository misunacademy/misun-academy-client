name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_BASE_API_URL: https://ci-placeholder.example.com/api/v1
  NEXT_PUBLIC_APP_URL: https://ci-placeholder.example.com
  NEXT_PUBLIC_AUTH_URL: https://ci-placeholder.example.com/api/v1/auth
  AUTH_URL: https://ci-placeholder.example.com/api/v1/auth
  NEXT_PUBLIC_MA_FRONTEND_URL: https://ma.ci-placeholder.example.com
  NEXT_PUBLIC_EP_FRONTEND_URL: https://esun.ci-placeholder.example.com
  NEXT_PUBLIC_SITE_URL: https://ci-placeholder.example.com

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
